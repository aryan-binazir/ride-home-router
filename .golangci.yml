version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - exhaustive
    - gosec
    - loggercheck
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - rowserrcheck
    - sloglint
    - sqlclosecheck
  exclusions:
    rules:
      # Handler request logging is deliberately verbose; user-controlled values are
      # passed through logutil.SafeString at the call sites that log them.
      - path: internal/handlers/
        linters:
          - gosec
        text: "G706"

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
