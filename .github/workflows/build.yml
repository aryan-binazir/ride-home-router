name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ride_home_router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ride_home_router_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ride_home_router_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
      - name: Scan reachable Go vulnerabilities
        run: go tool govulncheck ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make verify vet test
      - name: Check coverage
        run: go tool cover -func=coverage.out
      - name: Cross-build for the container target
        run: GOOS=linux GOARCH=amd64 make build
