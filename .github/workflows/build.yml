name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ride_home_router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ride_home_router_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ride_home_router_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
      - name: Scan reachable Go vulnerabilities
        run: go tool govulncheck ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: make verify vet test
      - name: Check coverage
        run: go tool cover -func=coverage.out

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build container targets
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t ride-home-router:ci .
          docker buildx build --platform linux/amd64 --load -t ride-home-router:ci .
      - name: Smoke-test migration readiness
        run: |
          set -euo pipefail
          network="ride-home-router-smoke-${{ github.run_id }}"
          postgres_container="ride-home-router-postgres-${{ github.run_id }}"
          app_container="ride-home-router-app-${{ github.run_id }}"
          database_url="postgres://postgres:postgres@${postgres_container}:5432/ride_home_router?sslmode=disable"

          docker network create "$network"
          docker run -d --name "$postgres_container" --network "$network" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=ride_home_router \
            postgres:18

          postgres_ready=false
          for _ in $(seq 1 30); do
            if docker exec "$postgres_container" pg_isready -U postgres -d ride_home_router >/dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 2
          done
          if [ "$postgres_ready" != true ]; then
            docker logs "$postgres_container"
            exit 1
          fi

          docker run -d --name "$app_container" --network "$network" \
            -e DATABASE_URL="$database_url" \
            -e ALLOWED_HOSTS=router.internal.example \
            --health-start-period=1s \
            --health-interval=2s \
            --health-timeout=3s \
            --health-retries=1 \
            ride-home-router:ci

          negative_observed=false
          for _ in $(seq 1 30); do
            running=$(docker inspect --format '{{.State.Running}}' "$app_container")
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$app_container")
            if [ "$running" != true ]; then
              docker logs "$app_container"
              exit 1
            fi
            if [ "$health" = healthy ]; then
              echo "container became healthy before migrations" >&2
              exit 1
            fi
            if [ "$health" = unhealthy ]; then
              negative_observed=true
              break
            fi
            sleep 2
          done
          if [ "$negative_observed" != true ]; then
            docker logs "$app_container"
            echo "container did not become unhealthy before migrations" >&2
            exit 1
          fi

          docker run --rm --network "$network" \
            -e DATABASE_URL="$database_url" \
            ride-home-router:ci migrate
          docker restart "$app_container"

          healthy_observed=false
          for _ in $(seq 1 30); do
            running=$(docker inspect --format '{{.State.Running}}' "$app_container")
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$app_container")
            if [ "$running" != true ]; then
              docker logs "$app_container"
              exit 1
            fi
            if [ "$health" = healthy ]; then
              healthy_observed=true
              break
            fi
            sleep 2
          done
          if [ "$healthy_observed" != true ]; then
            docker logs "$app_container"
            echo "container did not become healthy after migrations" >&2
            exit 1
          fi
      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm -f "ride-home-router-app-${{ github.run_id }}" "ride-home-router-postgres-${{ github.run_id }}" 2>/dev/null || true
          docker network rm "ride-home-router-smoke-${{ github.run_id }}" 2>/dev/null || true
