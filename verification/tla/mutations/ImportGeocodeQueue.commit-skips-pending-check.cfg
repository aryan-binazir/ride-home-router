\* Mutation: commitPersistent drops the NeedsGeocoding / ErrGeocodingInProgress check.
\* expect: invariant CommitOnlyWhenResolved
CONSTANTS
    Workers = {w1, w2}
    None = None
    JobRows <- DefaultJobRows
    MaxGeocodeRounds = 3
    MaxCrashes = 1
    SelectableRows = {1}
    GuardClaimReservesAttempt = TRUE
    GuardFinishIsOneTransaction = TRUE
    GuardFinishKeepsLiveSelection = TRUE
    GuardCommitChecksPending = FALSE
    GuardDoneJobsAreClosed = TRUE
    GuardReleaseChecksToken = TRUE
    GuardFinishChecksToken = TRUE
    GuardFinishChecksLease = TRUE
    GuardFinishChecksSession = TRUE
    AssumeTimelyFinalization = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT CommitOnlyWhenResolved
