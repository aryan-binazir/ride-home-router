\* Mutation: update and CompareAndSwap both stop rejecting a consumed record. An edit that loads after the save sees the bumped revision, so the revision check does not cover it.
\* expect: invariant NoEditAckedAfterSave
CONSTANTS
    Edits = {e1, e2}
    Resets = {x1}
    Saves = {s1, s2}
    GuardCASChecksRevision = TRUE
    GuardEditRejectsSaved = FALSE
    GuardSaveRejectsSaved = TRUE
    GuardUniqueEventPerSession = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoEditAckedAfterSave
