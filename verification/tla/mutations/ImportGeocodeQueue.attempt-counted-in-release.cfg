\* Mutation: Claim stops reserving the round; Release counts it, so a crash inside the provider call is never counted.
\* expect: invariant ProviderRoundsBounded
CONSTANTS
    Workers = {w1, w2}
    None = None
    JobRows <- DefaultJobRows
    MaxGeocodeRounds = 3
    MaxCrashes = 1
    SelectableRows = {1}
    GuardClaimReservesAttempt = FALSE
    GuardFinishIsOneTransaction = TRUE
    GuardFinishKeepsLiveSelection = TRUE
    GuardCommitChecksPending = TRUE
    GuardDoneJobsAreClosed = TRUE
    GuardReleaseChecksToken = TRUE
    GuardFinishChecksToken = TRUE
    GuardFinishChecksLease = TRUE
    GuardFinishChecksSession = TRUE
    AssumeTimelyFinalization = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT ProviderRoundsBounded
