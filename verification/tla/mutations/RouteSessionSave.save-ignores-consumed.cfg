    Edits = {e1, e2}
    Resets = {x1}
    Saves = {s1, s2}
    GuardCASChecksRevision = TRUE
    GuardEditRejectsSaved = TRUE
    GuardSaveRejectsSaved = FALSE
    GuardUniqueEventPerSession = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT EventSavedAtMostOnce
