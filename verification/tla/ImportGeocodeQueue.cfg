CONSTANTS
    Workers = {w1, w2}
    None = None
    JobRows <- DefaultJobRows
    MaxGeocodeRounds = 3
    MaxCrashes = 1
    SelectableRows = {1}
    GuardClaimReservesAttempt = TRUE
    GuardFinishIsOneTransaction = TRUE
    GuardFinishKeepsLiveSelection = TRUE
    GuardCommitChecksPending = TRUE
    GuardDoneJobsAreClosed = TRUE
    GuardReleaseChecksToken = TRUE
    GuardFinishChecksToken = TRUE
    GuardFinishChecksLease = TRUE
    GuardFinishChecksSession = TRUE
    AssumeTimelyFinalization = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AtMostOneResultPerJob
    ProviderRoundsBounded
    GeocodingKeepsSelection
    CommitOnlyWhenResolved
    FinishHasAuthority
    NoWriteAfterClose
    CompletedJobsResolved
