{{range .}}
<button type="button" class="address-suggestion" data-address="{{.Label}}">
    {{.Label}}
</button>
{{else}}
<div class="address-no-results">No addresses found</div>
{{end}}
{{if .}}<div class="address-attribution"><img src="/static/img/google-maps-attribution.svg" alt="Google Maps" width="98" height="18"></div>{{end}}
