{{define "address_match_marker"}}
<button type="button"
        class="address-marker address-marker-{{.Match}}"
        data-address-marker
        data-kind="{{.Kind}}"
        data-id="{{.ID}}"
        data-row="{{.Row}}"
        data-match="{{.Match}}"
        data-address="{{.Address}}"
        data-matched="{{.Matched}}"
        title="{{if eq .Match "guessed"}}Check this address{{else if eq .Match "confirmed"}}Address confirmed{{else}}Address verified{{end}}"
        aria-label="{{if eq .Match "guessed"}}Check the address for {{.Name}}{{else}}Address status for {{.Name}}{{end}}">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 1a5 5 0 0 0-5 5c0 3.6 4.3 8.4 4.5 8.6a.7.7 0 0 0 1 0C8.7 14.4 13 9.6 13 6a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
</button>
{{end}}
