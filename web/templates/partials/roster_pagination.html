{{define "roster_pagination"}}
<nav class="route-editor-pagination roster-pagination" aria-label="Roster pages">
  {{if .PreviousURL}}<button type="button" data-page="prev" class="btn btn-sm btn-outline" hx-get="{{.PreviousURL}}" hx-target="#{{.Target}}" hx-swap="innerHTML show:#{{.Kind}}-roster:top">Previous</button>{{end}}
  {{if .NextURL}}<button type="button" data-page="next" class="btn btn-sm btn-outline" hx-get="{{.NextURL}}" hx-target="#{{.Target}}" hx-swap="innerHTML show:#{{.Kind}}-roster:top">Next</button>{{end}}
</nav>
{{end}}
