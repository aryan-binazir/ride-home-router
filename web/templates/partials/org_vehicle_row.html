{{define "org_vehicle_row"}}
<div class="list-card" id="org-vehicle-{{.ID}}">
    <div class="d-flex justify-between align-center gap-2">
        <div>
            <div class="d-flex align-center gap-2">
                <strong>{{.Name}}</strong>
                <span class="badge badge-muted">{{.Capacity}} available {{pluralize .Capacity "seat"}}</span>
            </div>
        </div>
        <div class="table-actions">
            <button hx-get="/api/v1/org-vehicles/{{.ID}}/edit"
                    hx-target="#org-vehicle-{{.ID}}"
                    hx-swap="outerHTML"
                    class="btn btn-sm btn-outline">
                Edit
            </button>
            <button hx-delete="/api/v1/org-vehicles/{{.ID}}"
                    hx-confirm="Delete this van? This can't be undone."
                    hx-target="#org-vehicle-{{.ID}}"
                    hx-swap="outerHTML swap:1s"
                    class="btn btn-danger btn-sm">
                Delete
            </button>
        </div>
    </div>
</div>
{{end}}
