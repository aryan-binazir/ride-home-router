<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}Ride Home Router</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/event-planner.js" defer></script>
    <script src="/static/js/ui.js" defer></script>
</head>
<body class="{{if eq .ActivePage "home"}}planner-page{{else}}standard-page{{end}}">
    <div class="app-shell">
        <header class="appbar">
            <a class="brand-link" href="/">Ride Home Router</a>
            <nav class="nav" aria-label="Primary navigation">
                <a href="/" {{if eq .ActivePage "home"}}class="active" aria-current="page"{{end}}>Event Planning</a>
                <a href="/participants" {{if eq .ActivePage "participants"}}class="active" aria-current="page"{{end}}>Participants</a>
                <a href="/drivers" {{if eq .ActivePage "drivers"}}class="active" aria-current="page"{{end}}>Drivers</a>
                <a href="/labels" {{if eq .ActivePage "labels"}}class="active" aria-current="page"{{end}}>Labels</a>
                <a href="/activity-locations" {{if eq .ActivePage "activity_locations"}}class="active" aria-current="page"{{end}}>Activity Locations</a>
                <a href="/vans" {{if eq .ActivePage "vans"}}class="active" aria-current="page"{{end}}>Vans</a>
                <a href="/history" {{if eq .ActivePage "history"}}class="active" aria-current="page"{{end}}>History</a>
                <a href="/settings" {{if eq .ActivePage "settings"}}class="active" aria-current="page"{{end}}>Settings</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="main">
                {{template "content" .}}
            </div>
        </main>
        <footer class="desktop-mode-footer">
            <a href="/m/desktop-preference?clear=1">Mobile site</a>
        </footer>
    </div>
</body>
</html>
