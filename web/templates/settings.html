{{define "content"}}
<div class="page-header">
    <div>
        <h1 class="page-title">Settings</h1>
        <p class="page-subtitle">Manage route preferences.</p>
    </div>
</div>

<div class="card">
    <h3>Route Preferences</h3>
    <p class="text-muted">These preferences apply to event planning and saved history.</p>

    <form id="settings-form"
          hx-put="/api/v1/settings"
          hx-swap="none"
          hx-indicator="#settings-loading">
        <div class="form-group">
            <label class="form-label">Distance Units</label>
            <div class="d-flex align-center gap-2">
                <label class="checkbox-label">
                    <input type="checkbox"
                           name="use_miles"
                           class="form-checkbox"
                           {{if .Settings.UseMiles}}checked{{end}}>
                    <span>Use miles instead of kilometers</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="sme-email">Reviewer email</label>
            <input type="email"
                   id="sme-email"
                   name="sme_email"
                   class="form-input"
                   value="{{.Settings.SMEEmail}}">
            <p class="form-help">Route edits saved by this person help improve route suggestions. Leave blank to turn this off.</p>
        </div>

        <div class="d-flex align-center gap-2">
            <button type="submit" class="btn btn-primary">
                Save preferences
            </button>
            <span class="loading htmx-indicator" id="settings-loading"></span>
        </div>
    </form>
</div>
{{if .IsAdmin}}<div hx-get="/api/v1/settings/google-maps-key" hx-trigger="load" hx-swap="outerHTML"></div><div id="access-management" role="status" hx-get="/api/v1/access" hx-trigger="load" hx-swap="outerHTML"><p>Loading approved emails…</p></div>{{end}}
{{end}}
