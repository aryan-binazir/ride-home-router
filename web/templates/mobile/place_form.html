{{define "mobile_content"}}<form class="mobile-screen" action="{{.Action}}" method="post">{{template "mobile_back_header" (dict "BackURL" "/m/places" "BackLabel" "Places" "Title" .Title)}}<div class="mobile-form-card">{{with .Place}}<label>Name<input name="name" value="{{.Name}}" required></label>{{if eq $.Kind "location"}}<label>Street address<input name="address" value="{{.Address}}" required autocomplete="street-address" hx-get="/m/address-search" hx-trigger="input changed delay:300ms" hx-target="next .mobile-address-results"></label><div class="mobile-address-results"></div>{{else}}<label>Passenger capacity<input type="number" min="1" max="50" name="capacity" value="{{.Capacity}}" required></label>{{end}}{{else}}<label>Name<input name="name" required></label>{{if eq .Kind "location"}}<label>Street address<input name="address" required autocomplete="street-address" hx-get="/m/address-search" hx-trigger="input changed delay:300ms" hx-target="next .mobile-address-results"></label><div class="mobile-address-results"></div>{{else}}<label>Passenger capacity<input type="number" min="1" max="50" name="capacity" value="8" required></label>{{end}}{{end}}</div><div class="mobile-primary-zone"><button class="mobile-button" type="submit">Save</button></div></form>{{end}}
