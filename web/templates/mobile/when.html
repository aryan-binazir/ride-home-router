{{define "mobile_content"}}
<form class="mobile-screen" action="/m/plan/when" method="post">
  {{template "mobile_back_header" (dict "BackURL" "/m" "BackLabel" "Plan" "Title" "When")}}
  <div class="mobile-form-card">
    <label>
      Depart time
      <input type="time" name="route_time" value="{{.RouteTime}}" required>
    </label>
    <fieldset>
      <legend>Route mode</legend>
      <label class="mobile-segment">
        <input type="radio" name="mode" value="dropoff" {{if ne .Mode "pickup"}}checked{{end}}>
        <span>Dropoff</span>
      </label>
      <label class="mobile-segment">
        <input type="radio" name="mode" value="pickup" {{if eq .Mode "pickup"}}checked{{end}}>
        <span>Pickup</span>
      </label>
    </fieldset>
  </div>
  <p class="mobile-help">Dropoff starts at the activity. Pickup finishes there.</p>
  <div class="mobile-primary-zone"><button class="mobile-button" type="submit">Done</button></div>
</form>
{{end}}
