{{define "mobile_content"}}
<form class="mobile-screen" action="{{.Action}}" method="post">
  {{template "mobile_back_header" (dict "BackURL" "/m/people" "BackLabel" "People" "Title" .Title)}}
  <div class="mobile-form-card">
    <label>
      Name
      <input name="name" value="{{.Name}}" required>
    </label>
    <label>
      Address label
      <input name="address_name" value="{{.AddressName}}" placeholder="Home">
    </label>
    <label>
      Street address
      <input name="address" value="{{.Address}}" required autocomplete="street-address" hx-get="/api/v1/address-search" hx-headers='{"X-RHR-Mobile":"1"}' hx-trigger="input changed delay:300ms" hx-target="next .mobile-address-results">
    </label>
    <div class="mobile-address-results"></div>
    {{if eq .Kind "driver"}}
    <label>
      Passenger capacity
      <input type="number" min="1" max="50" name="vehicle_capacity" value="{{.VehicleCapacity}}" required>
    </label>
    {{end}}
    {{if .Labels}}
    <fieldset>
      <legend>Labels</legend>
      {{range .Labels}}
      <label class="mobile-check">
        <input type="checkbox" name="label_ids" value="{{.ID}}" {{if index $.Selected .ID}}checked{{end}}>
        <span>{{.Name}}</span>
      </label>
      {{end}}
    </fieldset>
    {{end}}
  </div>
  <div class="mobile-primary-zone"><button class="mobile-button" type="submit">Save</button></div>
</form>
{{end}}
