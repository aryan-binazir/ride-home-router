{{define "content"}}
<div class="page-header">
    <div>
        <h1 class="page-title">Vans</h1>
        <p class="page-subtitle">Add shared vans and assign one to a selected driver when planning an event.</p>
    </div>
</div>

<div class="card">
    <h3>Saved Vans</h3>

    <form hx-post="/api/v1/org-vehicles"
          hx-target="#org-vehicle-list"
          hx-swap="beforeend"
          hx-on::after-request="if(event.detail.requestConfig.verb === 'post') { this.reset(); const empty = document.getElementById('no-vans-message'); if (empty) empty.remove(); }"
          class="mb-4">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Van Name</label>
                <input type="text"
                       name="name"
                       class="form-input"
                       placeholder="e.g., School Van"
                       required>
            </div>
            <div class="form-group">
                <label class="form-label">Available Capacity</label>
                <input type="number"
                       name="capacity"
                       class="form-input"
                       placeholder="Available Seats"
                       min="1"
                       required>
            </div>
            <div class="form-group form-group-actions">
                <button type="submit" class="btn btn-primary">Add Van</button>
            </div>
        </div>
    </form>

    <div id="org-vehicle-list">
        {{if .OrgVehicles}}
        {{range .OrgVehicles}}
        {{template "org_vehicle_row" .}}
        {{end}}
        {{else}}
        <p class="text-muted" id="no-vans-message">No vans yet. Add one above.</p>
        {{end}}
    </div>
</div>
{{end}}
